<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>JNFAM Batch Sheet</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
:root{--bg:#f4f6f9;--card:#fff;--line:#dfe3ea;--tx:#1f2937;--mut:#6b7280;--pri:#1d4ed8;--pri2:#e8efff;--ok:#15803d;--okbg:#e7f6ec;--bad:#b91c1c;--badbg:#fdecec;--warn:#b45309;--warnbg:#fff4e0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 16px}
.top h1{font-size:18px;margin:0;white-space:nowrap}
.top .bid{font-family:ui-monospace,Menlo,monospace;font-weight:700;color:var(--pri)}
.top .sp{flex:1}
.conn{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 16px;min-height:44px;cursor:pointer;font-weight:600}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad);border-color:#f3c4c4}
.btn.sm{min-height:34px;padding:6px 12px;font-size:14px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.card h2{font-size:17px;margin:0 0 12px;display:flex;align-items:center;gap:10px}
.card h3{font-size:15px;margin:16px 0 8px;color:#374151}
.help{font-size:13px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.fld label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px;font-weight:600}
.fld input,.fld select,.fld textarea,td input,td select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;background:#fff}
.fld textarea{min-height:64px}
input:disabled,select:disabled,textarea:disabled{background:#f3f4f6}
.ro{padding:10px 12px;min-height:44px;border-radius:10px;background:#f3f4f6;font-weight:600;display:flex;align-items:center}
.steps{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:61px;z-index:15}
.step{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;background:#fff;cursor:pointer;display:flex;gap:6px;align-items:center;min-height:40px}
.step.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.step .cnt{font-size:11px;padding:1px 7px;border-radius:999px;background:#eef1f5;color:var(--mut)}
.step.on .cnt{background:rgba(255,255,255,.25);color:#fff}
.step .cnt.full{background:var(--okbg);color:var(--ok)}
.tog{display:inline-flex;align-items:center;justify-content:center;min-width:64px;min-height:44px;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:700;cursor:pointer;padding:0 12px;color:var(--mut);gap:6px}
.tog.on{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.tog.no.on{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.sig{display:inline-flex;flex-direction:column;align-items:flex-start;justify-content:center;min-width:130px;min-height:44px;border-radius:10px;border:2px dashed #b9c2d0;background:#fafbfc;cursor:pointer;padding:4px 12px;font-size:14px;color:var(--mut);font-weight:600}
.sig.on{border-style:solid;border-color:var(--pri);background:var(--pri2);color:var(--pri)}
.sig small{font-weight:400;font-size:11px;color:var(--mut)}
table.t{width:100%;border-collapse:collapse}
table.t th{font-size:13px;color:var(--mut);text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:6px 8px;border-bottom:1px solid #eef0f4;vertical-align:middle}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:700}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.gray{background:#eef1f5;color:var(--mut)}.pill.blue{background:var(--pri2);color:var(--pri)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chk-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #eef0f4}
.chk-row .lb{font-weight:600}
.chk-row .lb small{display:block;font-weight:400;color:var(--mut);font-size:13px}
.time-row{display:flex;gap:8px;align-items:end;flex-wrap:wrap;padding:10px 12px;background:#f8fafc;border-radius:10px;border:1px solid var(--line);margin-bottom:12px}
.time-row .fld{flex:1;min-width:220px}
.banner{padding:12px 14px;border-radius:10px;font-size:14px;margin-bottom:12px}
.banner.warn{background:var(--warnbg);color:var(--warn)}.banner.bad{background:var(--badbg);color:var(--bad)}.banner.ok{background:var(--okbg);color:var(--ok)}.banner.blue{background:var(--pri2);color:var(--pri)}
.prodsel{display:flex;gap:8px;flex-wrap:wrap}
.prodsel .tog{min-width:120px}
.navbar{display:flex;justify-content:space-between;gap:10px;margin:18px 0 40px}
.list-card{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;cursor:pointer}
.list-card .bn{font-family:ui-monospace,Menlo,monospace;font-weight:800;font-size:18px}
.worker{border:1px solid var(--line);border-radius:12px;padding:12px}
.worker .items{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.worker .items .tog{min-width:0;width:100%;justify-content:flex-start;font-size:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv b{color:var(--mut);font-weight:600}
#modalBg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modalBg.open{display:flex}
.modal{background:#fff;border-radius:16px;padding:20px;width:560px;max-width:100%;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 12px}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:10px 0}
.names button{min-height:52px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 18px;border-radius:12px;display:none;z-index:60;max-width:90vw}
#loginGate{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:40;flex-direction:column;gap:14px;text-align:center;padding:20px}
#loginMsg{white-space:pre-line;color:var(--bad);font-size:14px}
#busy{position:fixed;inset:0;background:rgba(255,255,255,.85);display:none;align-items:center;justify-content:center;z-index:70;flex-direction:column;gap:12px;font-weight:700}
.spin{width:40px;height:40px;border:4px solid #dbe3f1;border-top-color:var(--pri);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:700px){.top h1{font-size:15px}.chk-row{grid-template-columns:1fr}.steps{top:57px}}

/* ---------- PDF 출력용 (화면 밖) ---------- */
#printArea{position:fixed;left:-10000px;top:0}
.pg{width:794px;min-height:1123px;background:#fff;color:#000;padding:36px 40px;font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",Arial,sans-serif;font-size:11px;line-height:1.35}
.pg h1{font-size:20px;text-align:center;margin:0;padding:8px;border:1.5px solid #000;letter-spacing:2px}
.pg h2{font-size:13px;margin:14px 0 6px;padding:4px 6px;background:#e5e7eb;border:1px solid #000}
.pg table{width:100%;border-collapse:collapse;margin-bottom:6px}
.pg td,.pg th{border:1px solid #000;padding:4px 5px;vertical-align:middle}
.pg th{background:#f1f3f5;font-weight:700;text-align:center}
.pg .c{text-align:center}.pg .r{text-align:right}
.pg .v{font-weight:700;color:#0b3d91;text-align:center}
.pg .pass{color:#0a7a2f;font-weight:800;text-align:center}.pg .fail{color:#b00;font-weight:800;text-align:center}
.pg .hdr{display:grid;grid-template-columns:1fr 150px;gap:10px;align-items:stretch;margin-bottom:10px}
.pg .appr td{height:34px;text-align:center}
.pg .foot{margin-top:10px;font-size:9px;color:#555;display:flex;justify-content:space-between}
.pg .sg{font-size:10px;color:#0b3d91;text-align:center}
</style>
</head>
<body>
<div class="top">
  <h1>JNFAM Batch Sheet</h1>
  <span class="bid" id="topBid"></span>
  <span class="sp"></span>
  <span class="conn" id="conn"><span class="dot" style="background:#94a3b8"></span>연결 중…</span>
  <button class="btn sm" onclick="app.go('list')">목록</button>
  <button class="btn sm" onclick="app.go('settings')">설정</button>
</div>
<div id="demoBar" style="display:none;background:#fff4e0;color:#b45309;padding:10px 16px;font-size:14px;font-weight:600;border-bottom:1px solid #f3d9a8">⚠ DEMO 모드 — 실제 재고 현황 시스템(Firebase)에 연결되지 않았습니다. 파일을 PC에서 직접 열면 항상 DEMO로 동작하며, 표시되는 재고는 샘플입니다. 실제 재고는 GitHub Pages 주소(https://yt9495.github.io/jnfam-batch/)로 접속해야 반영됩니다.</div>
<div id="stepsBar" class="steps" style="display:none"></div>
<div class="wrap" id="main"></div>
<div id="printArea"></div>
<div id="modalBg"><div class="modal" id="modalBox"></div></div>
<div id="toast"></div>
<div id="busy"><div class="spin"></div><div id="busyMsg">처리 중…</div></div>
<div id="loginGate">
  <h2 style="margin:0">JNFAM Batch Sheet</h2>
  <div class="help">허용된 Google 계정으로 로그인해야 사용할 수 있습니다 (재고 현황 시스템과 같은 계정)</div>
  <button class="btn pri" onclick="app.googleLogin()">Google 계정으로 로그인</button>
  <div id="loginMsg"></div>
</div>

<script type="module">
/* =====================================================================
   JNFAM Batch Sheet (태블릿용)
   - 원본: JNFAM_Batch_Sheet_R2 (Materials + Production 시트)
   - Firestore (jnfam-ledger 프로젝트, 재고 현황 시스템과 공유)
       batch_sheets   : 배치시트 문서 (작성중/완료)
       batch_config   : main 문서 — 작업자 명단, SharePoint 설정, 기준값
       inv_lots / inv_usage / inv_isos / inv_products : 재고 현황 시스템 (읽기 + 완료 시 ISO 충전 등록)
   - PDF: html2canvas + jsPDF → SharePoint(Microsoft Graph, MSAL 로그인) 업로드
   ===================================================================== */
const FB_CFG={apiKey:"AIzaSyDB1-k-Xp98Sw3mx2AM3AxROo-Y4_4FZoY",authDomain:"jnfam-ledger.firebaseapp.com",projectId:"jnfam-ledger",
  storageBucket:"jnfam-ledger.firebasestorage.app",messagingSenderId:"656610691213",appId:"1:656610691213:web:1d03f91bd8dd36b2283ac4"};
const FB_URL='https://www.gstatic.com/firebasejs/10.12.2/';
const COL={batch:'batch_sheets',cfg:'batch_config',products:'inv_products',lots:'inv_lots',usage:'inv_usage',isos:'inv_isos',hist:'inv_history'};
const DEMO=new URLSearchParams(location.search).has('demo')||location.protocol==='file:';
const DEFAULT_SHARE='https://jnfam.sharepoint.com/:f:/s/JNFAM/IgBZz-QhlluJRLK0n6we7ihLAcHkIf2hwlshHrU8WZVRHy8?e=ASFJPA';

/* 엑셀 Materials 시트 수식 기준 품목 정의 */
const PROD={
  'HF':        {un:'1790',invCode:'1790',iso:'240003 (7)',iso2:'240002(1)',target:18400,req:'16 IBC',count:16,unit:1150,room:'300',v:'V3',name:'HF',drum:false},
  'HNO3':      {un:'2031',invCode:'2031',iso:'240004 (2)',iso2:'',target:18600,req:'15 IBC',count:15,unit:1240,room:'200',v:'V2',name:'HNO3',drum:false},
  'HCl (IBC)': {un:'1789',invCode:'1789',iso:'240001 (6)',iso2:'',target:18700,req:'17 IBC',count:17,unit:1100,room:'100',v:'V1',name:'HCl',drum:false},
  'HCl (Drum)':{un:'1789',invCode:'1789',iso:'240001 (6)',iso2:'',target:18480,req:'22 pallet 88 Drum',count:88,unit:210,room:'100',v:'V1',name:'HCl',drum:true}
};
const PROD_KEYS=Object.keys(PROD);
const PPE_ITEMS=[['goggle','보호안경'],['tyvek','Tyvac'],['glove','보호장갑'],['mask','보호마스크'],['apron','앞치마 (apron)'],['sleeve','팔토시'],['shoes','안전화']];
const QC_ITEMS=['ISO Tank Valve check & open','Filling Room Quick 체결','ISO Ventilation Quick check & open','ISO Tank Operation Pressure check (0.5±0.1 bar)'];
const VALVE_OPEN=['00','20','01','03','04','05','06','11','14'], VALVE_CLOSE=['02','07','08','09','10','12','13'];
const AF_OPEN=['00','20','10','14'], AF_CLOSE=['08','11','13'];
const STEPS=['Material','(1) PPE','(2) RM & ISO','(3) 설비 점검','(4) 투입 전 확인','(5) Valve · 투입','(6) Air Flushing','완료'];
const DEF_CFG={workers:[],customers:['HWQ CTSV'],isoTanks:[{no:'240003 (7)',prod:'HF'},{no:'240002(1)',prod:'HF'},{no:'240004 (2)',prod:'HNO3'},{no:'240001 (6)',prod:'HCl'}],passMin:18200,passMax:19000,maxKg:19000,weighDangerLb:40000,weighPassLb:500,
  ms:{clientId:'4483db59-77c7-4277-a795-540aaf732c5b',tenantId:'9e2f9e87-0f8e-4b71-87d4-c0b36430e0a6',shareUrl:DEFAULT_SHARE,driveId:'',itemId:'',folderName:''}};

const state={batches:[],products:[],lots:[],usage:[],isos:[],cfg:JSON.parse(JSON.stringify(DEF_CFG)),loaded:false,view:'list',step:0,listF:'active'};
let cur=null, fb=null, AUM=null, auth=null, currentUser=null, unsubs=[], saveT=null;

/* ---------------- 유틸 ---------------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(Math.round(+n||0)).toLocaleString('en-US');
const fmt1=n=>(+n||0).toLocaleString('en-US',{maximumFractionDigits:1});
const pad=n=>String(n).padStart(2,'0');
const dLocal=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dLocal(new Date());
const nowLocal=()=>{ const d=new Date(); return dLocal(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes()); };
const dstr=v=>{ if(!v) return ''; if(typeof v==='string') return v.slice(0,10); if(v.toDate) return dLocal(v.toDate()); return ''; };
const dt=v=>v?String(v).replace('T',' '):'';
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const who=()=>currentUser?currentUser.email:(DEMO?'demo':'');
const num=v=>(v===''||v==null||isNaN(+v))?null:+v;
function toast(m,ms=3000){ const t=$('toast'); t.textContent=m; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',ms); }
function busy(on,msg){ $('busy').style.display=on?'flex':'none'; if(msg) $('busyMsg').textContent=msg; }
function openModal(html){ $('modalBox').innerHTML=html; $('modalBg').classList.add('open'); }
function closeModal(){ $('modalBg').classList.remove('open'); }
$('modalBg').addEventListener('mousedown',e=>{ if(e.target.id==='modalBg') closeModal(); });
function getP(o,path){ return path.split('.').reduce((a,k)=>a==null?undefined:a[k],o); }
function setP(o,path,v){ const ks=path.split('.'); let a=o; ks.slice(0,-1).forEach(k=>{ if(a[k]==null||typeof a[k]!=='object') a[k]=/^\d+$/.test(k)?[]:{}; a=a[k]; }); a[ks[ks.length-1]]=v; }
function setConn(kind,text){ const C={ok:'#22c55e',wait:'#f59e0b',off:'#94a3b8',err:'#ef4444'}; $('conn').innerHTML=`<span class="dot" style="background:${C[kind]}"></span>${text}`; }

/* ---------------- 재고 현황 시스템 계산 (inventory 앱과 동일 규칙) ---------------- */
const invProd=k=>state.products.find(p=>String(p.code)===PROD[k].invCode&&(PROD[k].invCode!=='2031'||p.key==='HNO3_65'))||state.products.find(p=>String(p.code)===PROD[k].invCode)||null;
function remMap(ex){ const m={}; state.usage.forEach(u=>{ if(u.lotId&&!(ex&&u.batchSheetId===ex)) m[u.lotId]=(m[u.lotId]||0)+(+u.qtyKg||0); }); return m; }
function lotRem(l,rm){ rm=rm||remMap(); return Math.max(0,Math.round(((+l.qtyIn||0)-(rm[l.id]||0))*100)/100); }
function availLots(k,keepIds){
  const p=invProd(k); if(!p) return []; const rm=remMap(cur&&cur.id);
  const cont=PROD[k].drum?'Drum':'IBC';
  return state.lots.filter(l=>l.product===p.key&&(keepIds.includes(l.id)||((l.container||'IBC')===cont&&!l.hold&&lotRem(l,rm)>0.01)))
    .sort((a,b)=>(dstr(a.receivedDate)||'').localeCompare(dstr(b.receivedDate)||''));
}
/* 현재고 선입선출 자동 배정: 필요 수량(IBC/Drum)만큼 입고일 순으로 Lot 채움 */
function autoAlloc(k){ const pd=PROD[k]; const rm=remMap(cur&&cur.id); let left=pd.count; const rows=[];
  for(const l of availLots(k,[])){ if(left<=0) break; const n=Math.min(left,Math.floor((lotRem(l,rm)+0.5)/pd.unit)); if(n<1) continue;
    rows.push({lotId:l.id,count:String(n),unitKg:'',sourceLot:l.sourceLot,snap:{sourceLot:l.sourceLot,unitKg:l.unitKg,product:l.product}}); left-=n; }
  return {rows:rows.length?rows:[{lotId:'',count:'',unitKg:''}],short:left}; }
/* 현재고 요약 (용기 기준: IBC 모드는 IBC Lot, Drum 모드는 Drum Lot · HOLD 제외) */
function curStock(k){ const pd=PROD[k]; const ls=availLots(k,[]); const rm=remMap(cur&&cur.id); const kg=ls.reduce((s,l)=>s+lotRem(l,rm),0); return {kg,ea:kg/pd.unit,n:ls.length}; }
const lotPre=k=>{ const p=invProd(k); return (p&&p.lotPrefix)||({HF:'JAHF',HNO3:'JAHN'}[k]||'JAHC'); };
const ymdOf=d=>(d||today()).slice(2).replace(/-/g,'');
/* Batch ID = 생성(제조) 기준: MF_JAHF-YYMMDD + A/B/C (MFG Start Date) */
function nextBatchId(k,date){ const pre=lotPre(k), ymd=ymdOf(date);
  const used=new Set(state.batches.filter(b=>!cur||b.id!==cur.id).map(b=>b.mat&&b.mat.batchId).filter(Boolean));
  for(const c of 'ABCDEFGHIJ'){ const s=`MF_${pre}-${ymd}${c}`; if(!used.has(s)) return s; }
  return `MF_${pre}-${ymd}A`;
}
/* 제품 ID = 출하 기준(Shipping List와 동일): JAHF-YYMMDD + A/B/C (Ship Date) — 재고 현황 시스템 JNFAM Lot 규칙과 동일 */
function nextProdId(k,date){ const pre=lotPre(k), ymd=ymdOf(date);
  const used=new Set([...state.usage.map(u=>u.jnfamLot),...state.isos.map(i=>i.jnfamLot),...state.batches.filter(b=>!cur||b.id!==cur.id).map(b=>b.mat&&b.mat.prodId)].filter(Boolean));
  for(const c of 'ABCDEFGHIJ'){ const s=`${pre}-${ymd}${c}`; if(!used.has(s)) return s; }
  return `${pre}-${ymd}A`;
}
const autoId=v=>!v||/-\d{6}[A-J]$/.test(v);

/* ISO Tank 목록 (설정에서 관리) */
const isoList=k=>(state.cfg.isoTanks||[]).filter(t=>t&&t.no&&(!t.prod||t.prod===PROD[k].name));
function defIso(k,n){ const pd=PROD[k]; const want=n===1?pd.iso:pd.iso2; const l=isoList(k).map(t=>t.no);
  if(want&&l.includes(want)) return want; if(n===2) return ''; return want||l[0]||''; }
function isoSel(path,none){ const k=PK(), v=getP(cur,path)||''; const l=isoList(k).map(t=>t.no); if(v&&!l.includes(v)) l.unshift(v);
  return `<select data-k="${path}" ${dis()}>${none?`<option value="" ${!v?'selected':''}>(없음)</option>`:(!v?'<option value="">— 선택 —</option>':'')}${l.map(n=>`<option ${n===v?'selected':''}>${esc(n)}</option>`).join('')}${locked()?'':'<option value="__new">＋ 새 ISO Tank 추가…</option>'}</select>`; }

/* ---------------- 배치 모델 ---------------- */
function newBatch(){
  const k='HF', d=today();
  return {id:uid('bs'),status:'작성중',createdBy:who(),createdAt:new Date().toISOString(),
    mat:{mfgDate:d,shipDate:d,product:k,batchId:'',prodId:'',customer:(state.cfg.customers||[])[0]||'',isoTank:defIso(k,1),isoTank2:'',weighIn:'',weighOut:'',lots:[{lotId:'',count:'',unitKg:''}]},
    ppe:{workers:[0,1,2,3].map(()=>({date:d,shift:'',dn:'',name:'',items:{}}))},
    s2:{start:'',end:'',chk:{},sig:null,qc:QC_ITEMS.map(()=>({chk:false,sig:null}))},
    s3:{start:'',end:'',pump:'',pumpSig:null,airP:'',pumpAct:'',scrubber:'',scrubberSig:null,compressor:'',compP:'',utilAct:'',vents:[false,false,false,false,false,false],ventSig:null,ventAct:''},
    s4:{start:'',end:'',chk:{}},
    s5:{start:'',end:'',open:{},close:{},sig:null,act:'',start2:'',end2:'',ibcChk:{},ibcAct:''},
    s6:{start:'',end:'',ctrl:false,airP:'',isoP:'',sig1:null,open:{},close:{},sig:null,act:''},
    done:{author:null}};
}
function ensure(b){ const n=newBatch(); for(const k of Object.keys(n)) if(b[k]==null) b[k]=n[k]; for(const s of ['mat','ppe','s2','s3','s4','s5','s6','done']) for(const k of Object.keys(n[s])) if(b[s][k]==null) b[s][k]=n[s][k]; if(b.status!=='완료') b.mat.isoTank2=''; return b; }
const PK=()=>cur.mat.product, PD=()=>PROD[cur.mat.product]||PROD.HF;
const locked=()=>cur&&cur.status==='완료';
function matRows(b){ b=b||cur; const pd=PROD[b.mat.product]||PROD.HF;
  return (b.mat.lots||[]).map(r=>{ const l=state.lots.find(x=>x.id===r.lotId)||(r.snap||{}); const unit=num(r.unitKg)??pd.unit; const cnt=num(r.count)||0;
    return {...r,lot:l,sourceLot:l.sourceLot||r.sourceLot||'',unit,cnt,kg:Math.round(unit*cnt*100)/100}; }).filter(r=>r.lotId||r.cnt); }
function matTotal(b){ return matRows(b).reduce((s,r)=>s+r.kg,0); }
function matPass(b){ const t=matTotal(b); return t>=state.cfg.passMin&&t<=state.cfg.passMax; }
function weigh(b){ b=b||cur; const wi=num(b.mat.weighIn), wo=num(b.mat.weighOut); if(wi==null||wo==null) return null; const bal=wi-wo;
  return {bal,kg:Math.round(bal*0.4536),safe:bal>=state.cfg.weighDangerLb,pass:bal>state.cfg.weighPassLb}; }
/* 투입 순서 목록: IBC는 1개씩, Drum은 팔레트(4 drum) 단위 */
function ibcSeq(b){ b=b||cur; const pd=PROD[b.mat.product]||PROD.HF; const out=[];
  matRows(b).forEach(r=>{ if(pd.drum){ let left=r.cnt; while(left>0){ const n=Math.min(4,left); out.push({lot:r.sourceLot,kg:n*r.unit,label:`${n} drum`}); left-=n; } }
    else for(let i=0;i<r.cnt;i++) out.push({lot:r.sourceLot,kg:r.unit,label:'1 IBC'}); });
  return out; }

/* ---------------- 단계별 진행률 ---------------- */
function stepProg(i,b){ b=b||cur; const c=[];
  const S=v=>!!(v&&v.n);
  if(i===0){ c.push(!!b.mat.batchId,!!b.mat.prodId,!!b.mat.mfgDate,!!b.mat.shipDate,!!b.mat.isoTank,weigh(b)!=null,matRows(b).length>0,matPass(b)); }
  if(i===1){ const w=b.ppe.workers.filter(x=>x.name&&x.name.n||x.name&&typeof x.name==='string'); if(!w.length) c.push(false); w.forEach(x=>{ c.push(!!x.dn); PPE_ITEMS.forEach(([k])=>c.push(!!x.items[k])); }); }
  if(i===2){ c.push(!!b.s2.start,!!b.s2.end,...['isoUn','isoNo','isoName','weigh','cdsUn','cdsName','v105'].map(k=>!!b.s2.chk[k]),S(b.s2.sig),...b.s2.qc.flatMap(q=>[!!q.chk,S(q.sig)])); }
  if(i===3){ c.push(!!b.s3.start,!!b.s3.end,!!b.s3.pump,S(b.s3.pumpSig),b.s3.airP!=='',!!b.s3.scrubber,S(b.s3.scrubberSig),!!b.s3.compressor,b.s3.compP!=='',...b.s3.vents.map(Boolean),S(b.s3.ventSig)); }
  if(i===4){ c.push(!!b.s4.start,!!b.s4.end); matRows(b).forEach((r,j)=>c.push(!!b.s4.chk[j])); }
  if(i===5){ c.push(!!b.s5.start,!!b.s5.end,...VALVE_OPEN.map(v=>!!b.s5.open[v]),...VALVE_CLOSE.map(v=>!!b.s5.close[v]),S(b.s5.sig),!!b.s5.start2,!!b.s5.end2); ibcSeq(b).forEach((r,j)=>c.push(!!b.s5.ibcChk[j])); }
  if(i===6){ c.push(!!b.s6.start,!!b.s6.end,!!b.s6.ctrl,b.s6.airP!=='',b.s6.isoP!=='',S(b.s6.sig1),...AF_OPEN.map(v=>!!b.s6.open[v]),...AF_CLOSE.map(v=>!!b.s6.close[v]),S(b.s6.sig)); }
  if(i===7){ c.push(S(b.done.author)); }
  return [c.filter(Boolean).length,c.length];
}

/* ---------------- 저장 ---------------- */
function touch(){ if(!cur||locked()) return; cur.updatedAt=new Date().toISOString(); cur.updatedBy=who(); clearTimeout(saveT); saveT=setTimeout(saveNow,600); }
async function saveNow(){ clearTimeout(saveT); if(!cur) return; const data=JSON.parse(JSON.stringify(cur));
  if(fb){ try{ await fb.setDoc(fb.doc(fb.db,COL.batch,cur.id),data); }catch(e){ toast('저장 실패: '+(e.code||e.message)); } }
  else { const i=state.batches.findIndex(x=>x.id===cur.id); if(i>=0) state.batches[i]=data; else state.batches.unshift(data); } }
async function saveCfg(){ const data=JSON.parse(JSON.stringify(state.cfg)); if(fb) await fb.setDoc(fb.doc(fb.db,COL.cfg,'main'),data); toast('설정 저장됨'); }

/* ---------------- 공통 입력 위젯 ---------------- */
const dis=()=>locked()?'disabled':'';
const tog=(path,label,cls='')=>{ const on=!!getP(cur,path); return `<button class="tog ${cls} ${on?'on':''}" ${dis()} data-tog="${path}">${on?'✓ ':''}${label??'V'}</button>`; };
const okno=(path)=>{ const v=getP(cur,path); return `<button class="tog ${v==='OK'?'on':''}" ${dis()} data-set="${path}" data-v="OK">OK</button> <button class="tog no ${v==='NO'?'on':''}" ${dis()} data-set="${path}" data-v="NO">NO</button>`; };
const sig=(path,label='확인자 서명')=>{ const v=getP(cur,path); return v&&v.n?`<button class="sig on" ${dis()} data-sig="${path}">${esc(v.n)}<small>${esc(dt(v.t))}</small></button>`:`<button class="sig" ${dis()} data-sig="${path}">✍ ${label}</button>`; };
const inp=(path,type='text',attrs='')=>`<input type="${type}" data-k="${path}" value="${esc(getP(cur,path)??'')}" ${dis()} ${attrs}>`;
const timeRow=(ps,pe,title)=>`<div class="time-row"><div class="fld"><label>${title||'공정'} 시작 날짜 및 시간</label>${inp(ps,'datetime-local')}</div><button class="btn sm" ${dis()} data-now="${ps}">지금</button>
  <div class="fld"><label>${title||'공정'} 종료 날짜 및 시간</label>${inp(pe,'datetime-local')}</div><button class="btn sm" ${dis()} data-now="${pe}">지금</button></div>`;

/* ---------------- 렌더 ---------------- */
function render(){
  const m=$('main');
  $('topBid').textContent=(state.view==='edit'&&cur)?(cur.mat.batchId||'(Batch ID 미정)'):'';
  if(state.view==='edit'&&cur){ renderSteps(); $('stepsBar').style.display='flex'; }
  else $('stepsBar').style.display='none';
  const y=window.scrollY;
  if(state.view==='list') m.innerHTML=vList();
  else if(state.view==='settings') m.innerHTML=vSettings();
  else if(state.view==='edit'&&cur){ m.innerHTML=[vMat,vPPE,vS2,vS3,vS4,vS5,vS6,vDone][state.step]()+navBar(); window.scrollTo(0,y); }
}
function renderSteps(){ $('stepsBar').innerHTML=STEPS.map((s,i)=>{ const [a,t]=stepProg(i); return `<button class="step ${state.step===i?'on':''}" onclick="app.step(${i})">${s}<span class="cnt ${a===t?'full':''}">${a}/${t}</span></button>`; }).join(''); }
const navBar=()=>`<div class="navbar"><button class="btn" ${state.step===0?'disabled':''} onclick="app.step(${state.step-1})">← 이전</button>${state.step<7?`<button class="btn pri" onclick="app.step(${state.step+1})">다음 →</button>`:''}</div>`;

  if(f==='active') bs=bs.filter(b=>b.status!=='완료'); else if(f==='done') bs=bs.filter(b=>b.status==='완료');
  return `<div class="row" style="margin-bottom:14px"><button class="btn pri" onclick="app.newBatch()">＋ 새 배치 작성</button><span class="sp" style="flex:1"></span>
    ${[['active','작성중'],['done','완료'],['all','전체']].map(([k,l])=>`<button class="tog ${f===k?'on':''}" onclick="app.listF('${k}')">${l}</button>`).join('')}</div>
    ${bs.map(b=>{ ensure(b); const t=matTotal(b); const tot=STEPS.map((s,i)=>stepProg(i,b)).reduce((a,[x,y])=>[a[0]+x,a[1]+y],[0,0]);
      return `<div class="card list-card" onclick="app.open('${b.id}')">

      <div><div class="bn">${esc(b.mat.batchId||'(Batch ID 미정)')} <span style="color:var(--ok);font-size:15px">${esc(b.mat.prodId||'')}</span></div><div class="help">${esc(b.mat.product)} · 제조 ${esc(b.mat.mfgDate)} · 출고 ${esc(b.mat.shipDate||'-')} · ${esc(b.mat.customer||'')} · ISO ${esc(b.mat.isoTank||'')} · ${fmt(t)} kg</div>
      ${b.status==='완료'?`<div class="help">완료 ${esc(dt(b.done.at||''))} · ${esc(b.done.author&&b.done.author.n||'')} ${b.done.spUrl?'· <span class="pill blue">SharePoint 저장됨</span>':'· <span class="pill gray">SharePoint 미저장</span>'}</div>`:''}</div>
      <div class="help" style="text-align:right">${b.status==='완료'?'':`진행 ${tot[0]}/${tot[1]}<br><button class="btn sm danger" style="margin-top:6px" onclick="event.stopPropagation();app.delBatch('${b.id}')">삭제</button>`}</div></div>`; }).join('')||'<div class="card help">배치가 없습니다</div>'}`;
}

/* ---- Step 0: Material Sheet ---- */

  const b=cur, pd=PD(), w=weigh(), rows=matRows(), tot=matTotal(), pass=matPass(); const ip=invProd(PK());
  const keep=b.mat.lots.map(r=>r.lotId).filter(Boolean); const lots=availLots(PK(),keep); const rm=remMap(cur.id);

    <div class="grid">

      <div class="fld"><label>Batch ID (생성 기준 · MFG Start)</label><div class="row" style="flex-wrap:nowrap">${inp('mat.batchId','text','style="font-family:ui-monospace,monospace;font-weight:700"')}<button class="btn sm" style="white-space:nowrap" ${dis()} onclick="app.genId()">자동</button></div></div>
      <div class="fld"><label>Ship Date (출고일)</label>${inp('mat.shipDate','date')}</div>
      <div class="fld"><label>제품 ID (출하 기준 · Shipping List)</label><div class="row" style="flex-wrap:nowrap">${inp('mat.prodId','text','style="font-family:ui-monospace,monospace;font-weight:700;color:var(--ok)"')}<button class="btn sm" style="white-space:nowrap" ${dis()} onclick="app.genProdId()">자동</button></div></div>

  </div>`;
}

/* ---- Step 1: PPE ---- */
function vPPE(){
  return `<div class="card"><h2>(1) PPE check <span class="help">안전보호구 착용확인 — 성명 선택 후 V 체크</span></h2>
  <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(260px,1fr))">${cur.ppe.workers.map((w,i)=>`<div class="worker">
    <div class="row" style="justify-content:space-between"><b>작업자 ${i+1}</b>${sig(`ppe.workers.${i}.name`,'성명 선택')}</div>
    <div class="grid" style="grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">

/* ---------------- 이벤트 (위임) ---------------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tog],[data-set],[data-sig],[data-now]'); if(!t||!cur||locked()||t.disabled) return;
  if(t.dataset.tog){ setP(cur,t.dataset.tog,!getP(cur,t.dataset.tog)); touch(); render(); }
  else if(t.dataset.set){ const p=t.dataset.set, v=t.dataset.v; setP(cur,p,getP(cur,p)===v?'':v); touch(); render(); }
  else if(t.dataset.now){ setP(cur,t.dataset.now,nowLocal()); touch(); render(); }
  else if(t.dataset.sig){ pickName(t.dataset.sig); }
});
document.addEventListener('change',e=>{
  const t=e.target; if(!t.dataset||!t.dataset.k||!cur||locked()) return;
  const p=t.dataset.k; if(t.value==='__new'){ t.value=getP(cur,p)||''; newIsoModal(p); return; } setP(cur,p,t.value);
  if(/^mat\.lots\.\d+\.lotId$/.test(p)){ const i=+p.split('.')[2]; const l=state.lots.find(x=>x.id===t.value); const r=cur.mat.lots[i];
    r.sourceLot=l?l.sourceLot:''; r.snap=l?{sourceLot:l.sourceLot,unitKg:l.unitKg,product:l.product}:null;
    if(l&&!r.count){ const pd=PD(); const others=matRows().filter((x,j)=>x!==r).reduce((s,x)=>s+x.cnt,0); const u=pd.unit; r.count=String(Math.max(0,Math.min(pd.count-others,Math.floor(lotRem(l)/u)))); } }
  if(p==='mat.mfgDate'&&autoId(cur.mat.batchId)) cur.mat.batchId=nextBatchId(PK(),cur.mat.mfgDate);
  if(p==='mat.shipDate'&&autoId(cur.mat.prodId)) cur.mat.prodId=nextProdId(PK(),cur.mat.shipDate);
  touch(); render();
});

/* ---------------- 작성 완료: 재고 등록 ---------------- */
async function registerInventory(){
  const b=cur, pd=PD(), ip=invProd(PK()); if(!ip) throw new Error('재고 품목을 찾을 수 없습니다');
  const rows=matRows().filter(r=>r.lotId&&r.kg>0); if(!rows.length) throw new Error('투입 Lot이 없습니다');
  const date=b.mat.mfgDate||today(), jl=b.mat.prodId||b.mat.batchId, cust=b.mat.customer||'', note=`Batch Sheet ${b.mat.batchId}`;
  const isoId=uid('is'), uids=[], now=new Date().toISOString(), base={createdBy:who(),createdAt:now,updatedBy:who(),updatedAt:now};
  const ops=rows.map(r=>{ const id=uid('us'); uids.push(id); return {col:COL.usage,data:{id,lotId:r.lotId,product:ip.key,date,type:'ISO충전',qtyKg:r.kg,ea:r.cnt,customer:cust,jnfamLot:jl,note,isoId,batchSheetId:b.id,...base}}; });
  const tot=rows.reduce((s,r)=>s+r.kg,0);
  ops.push({col:COL.isos,data:{id:isoId,product:ip.key,tankNo:[b.mat.isoTank,b.mat.isoTank2].filter(Boolean).join(' / '),qtyKg:tot,fillDate:date,status:'대기',customer:cust,jnfamLot:jl,note,sourceUsageIds:uids,shipDate:'',batchSheetId:b.id,...base}});
  const h={id:uid('h'),tsMs:Date.now(),ts:now,user:who()||'-',userName:currentUser?(currentUser.displayName||''):'',action:'ISO 충전',kind:'out',col:COL.usage,docId:uids[0],product:ip.key,
    summary:`${ip.name} · ${fmt(tot)} kg · ${cust} · ${jl} · Lot ${rows.map(r=>`${r.sourceLot}(${fmt(r.kg)})`).join(', ')} · Batch Sheet`,changes:[]};
  if(fb){ const bt=fb.writeBatch(fb.db); ops.forEach(o=>bt.set(fb.doc(fb.db,o.col,o.data.id),o.data)); await bt.commit(); try{ await fb.setDoc(fb.doc(fb.db,COL.hist,h.id),h); }catch(e){ console.warn(e); } }
  else { ops.forEach(o=>(o.col===COL.usage?state.usage:state.isos).push(o.data)); }
  return {isoId,uids};
}
async function complete(){
  const b=cur; if(locked()) return;
  if(!b.mat.batchId||!b.mat.prodId){ toast('Batch ID와 제품 ID를 입력하세요'); state.step=0; render(); return; }
  if(state.isos.some(i=>i.jnfamLot===b.mat.prodId&&i.batchSheetId!==b.id)||state.batches.some(x=>x.id!==b.id&&x.status==='완료'&&x.mat&&x.mat.prodId===b.mat.prodId)){ if(!confirm(`제품 ID ${b.mat.prodId}가 재고 현황 시스템/다른 배치에 이미 있습니다. 그래도 진행할까요?`)) return; }
  if(!matRows().some(r=>r.lotId&&r.kg>0)){ toast('Material Sheet에서 Lot을 선택하세요'); state.step=0; render(); return; }
  if(!(b.done.author&&b.done.author.n)){ toast('작성자 서명을 선택하세요'); return; }
  const dup=state.batches.find(x=>x.id!==b.id&&x.status==='완료'&&x.mat&&x.mat.batchId===b.mat.batchId); if(dup){ toast('같은 Batch ID로 완료된 배치가 이미 있습니다'); return; }
  const rm=remMap(b.id); const over=matRows().filter(r=>{ const l=state.lots.find(x=>x.id===r.lotId); return l&&r.kg>lotRem(l,rm)+0.01; });
  const miss=STEPS.slice(0,7).filter((s,i)=>{ const [a,t]=stepProg(i); return a<t; });
  let msg=`${b.mat.batchId} 작성을 완료할까요?\n\n재고 현황 시스템에 ${fmt(matTotal())} kg ISO 충전이 등록됩니다.`;
  if(miss.length) msg+=`\n\n⚠ 미입력 단계: ${miss.join(', ')}`; if(!matPass()) msg+=`\n⚠ Material 합계 Fail`; if(over.length) msg+=`\n⚠ 현재고 초과 Lot: ${over.map(r=>r.sourceLot).join(', ')}`;
  if(!confirm(msg)) return;
  let spMode=cfgSpReady()?'sp':'download';
  if(spMode==='sp'){ try{ await msToken(); }catch(e){ if(!confirm('Microsoft 로그인 실패: '+(e.message||e)+'\n\nSharePoint 저장 없이 완료하고 PDF는 다운로드할까요?')) return; spMode='download'; } }
  busy(true,'재고 현황 시스템에 등록 중…');
  try{
    if(!b.done.invIsoId){ const r=await registerInventory(); b.done.invIsoId=r.isoId; b.done.invUsageIds=r.uids; }
    b.status='완료'; b.done.at=nowLocal(); b.done.by=who(); await saveNow();
    busy(false); render();
    await makePdf(spMode);
  }catch(e){ busy(false); console.error(e); toast('완료 처리 실패: '+(e.code||e.message),5000); }
}
async function reopen(){
  const b=cur; const iso=state.isos.find(i=>i.id===b.done.invIsoId);
  if(iso&&iso.status!=='대기'){ toast('ISO 탱크가 이미 출하 처리되어 되돌릴 수 없습니다. 재고 현황 시스템에서 먼저 처리하세요.',5000); return; }
  if(!confirm('완료를 취소하고 재고 현황 시스템의 ISO 충전 기록과 ISO 탱크(대기)를 삭제할까요?\n(SharePoint에 저장된 PDF는 그대로 남습니다)')) return;
  busy(true,'되돌리는 중…');
  try{ const ids=b.done.invUsageIds||state.usage.filter(u=>u.batchSheetId===b.id).map(u=>u.id);
    if(fb){ const bt=fb.writeBatch(fb.db); ids.forEach(id=>bt.delete(fb.doc(fb.db,COL.usage,id))); if(b.done.invIsoId) bt.delete(fb.doc(fb.db,COL.isos,b.done.invIsoId)); await bt.commit();
      try{ const h={id:uid('h'),tsMs:Date.now(),ts:new Date().toISOString(),user:who(),userName:currentUser?.displayName||'',action:'ISO 삭제',kind:'del',col:COL.isos,docId:b.done.invIsoId||'',product:(invProd(PK())||{}).key||'',summary:`Batch Sheet ${b.mat.batchId} 완료 취소 · ISO 충전 ${ids.length}건 삭제(IBC 복원)`,changes:[]}; await fb.setDoc(fb.doc(fb.db,COL.hist,h.id),h); }catch(e){} }
    else { state.usage=state.usage.filter(u=>!ids.includes(u.id)); state.isos=state.isos.filter(i=>i.id!==b.done.invIsoId); }
    b.status='작성중'; b.done={author:b.done.author,pdfName:b.done.pdfName||'',spUrl:b.done.spUrl||''}; b.reopenedAt=new Date().toISOString(); b.reopenedBy=who();
    await saveNow(); toast('완료가 취소되었습니다'); }
  catch(e){ toast('실패: '+(e.code||e.message)); }
  busy(false); render();
}

async function buildPdf(b){
  const area=$('printArea'); area.innerHTML=pdfPages(b);
  const { jsPDF }=window.jspdf; const doc=new jsPDF({unit:'mm',format:'a4',orientation:'portrait',compress:true});
  const pgs=[...area.querySelectorAll('.pg')];
  for(let i=0;i<pgs.length;i++){
    const cv=await html2canvas(pgs[i],{scale:2,backgroundColor:'#fff',useCORS:true,logging:false});
    const pageHpx=Math.round(cv.width*297/210);
    for(let y=0,k=0;y<cv.height-5;y+=pageHpx,k++){
      const h=Math.min(pageHpx,cv.height-y); const c=document.createElement('canvas'); c.width=cv.width; c.height=h; c.getContext('2d').drawImage(cv,0,y,cv.width,h,0,0,cv.width,h);
      if(i>0||k>0) doc.addPage(); doc.addImage(c.toDataURL('image/jpeg',0.9),'JPEG',0,0,210,h*210/cv.width);
    }
  }
  area.innerHTML='';
  return doc.output('blob');
}
const pdfName=b=>`BatchSheet_${(b.mat.batchId||'NOID').replace(/[^\w\-]/g,'_')}_${b.mat.mfgDate||today()}.pdf`;
function downloadBlob(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000); }
async function makePdf(mode){
  const b=cur; const name=pdfName(b);
  if(mode==='sp'){ try{ await msToken(); }catch(e){ toast('Microsoft 로그인 실패: '+(e.message||e),5000); if(!confirm('Microsoft 로그인에 실패했습니다. PDF를 이 기기에 다운로드할까요?')) return; mode='download'; } }
  busy(true,'PDF 생성 중…');
  try{
    const blob=await buildPdf(b);
    if(mode==='preview'){ busy(false); const u=URL.createObjectURL(blob); const w=window.open(u,'_blank'); if(!w) downloadBlob(blob,name); return; }
    if(mode==='download'){ busy(false); downloadBlob(blob,name); b.done.pdfName=name; await saveNow(); render(); return; }
    busy(true,'SharePoint에 업로드 중…');
    const item=await spUpload(blob,name);
    b.done.pdfName=name; b.done.spUrl=item.webUrl||''; b.done.spAt=new Date().toISOString(); await saveNow();
    busy(false); toast('SharePoint Batch Sheet 폴더에 저장되었습니다',4000); render();
  }catch(e){ busy(false); console.error(e);
    if(mode==='sp'){ if(confirm('SharePoint 저장 실패: '+(e.message||e)+'\n\nPDF를 이 기기에 다운로드할까요? (나중에 완료 화면에서 다시 저장할 수 있습니다)')){ try{ downloadBlob(await buildPdf(b),name); }catch(_){} } }
    else toast('PDF 생성 실패: '+(e.message||e),5000); }
}

let msalApp=null;
const cfgSpReady=()=>{ const ms=state.cfg.ms||{}; return !DEMO&&!!(ms.clientId&&ms.shareUrl); };
function getMsal(){ const ms=state.cfg.ms||{}; if(!ms.clientId) throw new Error('설정 탭에서 Microsoft Client ID를 입력하세요');
  if(!window.msal) throw new Error('MSAL 라이브러리를 불러오지 못했습니다');
  if(!msalApp||msalApp._cid!==ms.clientId){ msalApp=new msal.PublicClientApplication({auth:{clientId:ms.clientId,authority:'https://login.microsoftonline.com/'+(ms.tenantId||'organizations'),redirectUri:location.origin+location.pathname},cache:{cacheLocation:'localStorage'}}); msalApp._cid=ms.clientId; }
  return msalApp; }
function msAccount(){ try{ const a=msalApp||(state.cfg.ms&&state.cfg.ms.clientId?getMsal():null); const acc=a&&a.getAllAccounts()[0]; return acc?acc.username:''; }catch(e){ return ''; } }
const SCOPES=['Files.ReadWrite.All'];
/* 팝업 차단을 피하려고 initialize는 미리 해두고, 로그인 팝업은 버튼 탭 직후 첫 await에서 연다 */
let msalInitP=null;
function msalInit(){ try{ const a=getMsal(); if(!msalInitP||msalInitP._a!==a){ msalInitP=a.initialize?a.initialize():Promise.resolve(); msalInitP._a=a; } return msalInitP; }catch(e){ return Promise.resolve(); } }
async function msToken(){ const a=getMsal(); const acc=a.getAllAccounts()[0];
  if(acc){ try{ return (await a.acquireTokenSilent({scopes:SCOPES,account:acc})).accessToken; }catch(e){} }
  const r=await a.acquireTokenPopup({scopes:SCOPES,account:acc,prompt:acc?undefined:'select_account'}); return r.accessToken; }
async function graph(tk,url,opt={}){ const r=await fetch(url.startsWith('http')?url:'https://graph.microsoft.com/v1.0'+url,{...opt,headers:{Authorization:'Bearer '+tk,...(opt.headers||{})}});
  if(!r.ok){ let m=r.status+''; try{ const j=await r.json(); m+=' '+(j.error&&(j.error.code+': '+j.error.message)||''); }catch(e){} throw new Error('Graph '+m); } return r.status===204?{}:r.json(); }
function shareId(u){ const b=btoa(unescape(encodeURIComponent(u))).replace(/=+$/,'').replace(/\//g,'_').replace(/\+/g,'-'); return 'u!'+b; }
async function spResolve(tk){ const ms=state.cfg.ms;
  const it=await graph(tk,`/shares/${shareId(ms.shareUrl.trim())}/driveItem`,{headers:{Prefer:'redeemSharingLink'}});
  if(!it.folder) throw new Error('공유 링크가 폴더가 아닙니다');
  ms.driveId=it.parentReference.driveId; ms.itemId=it.id; ms.folderName=it.name; ms.folderUrl=it.webUrl; await saveCfg(); return ms; }
async function spUpload(blob,name){
  const tk=await msToken(); let ms=state.cfg.ms; if(!ms.itemId||!ms.driveId) ms=await spResolve(tk);
  const path=`/drives/${ms.driveId}/items/${ms.itemId}:/${encodeURIComponent(name)}:`;
  if(blob.size<3.8*1024*1024) return graph(tk,path+'/content?@microsoft.graph.conflictBehavior=replace',{method:'PUT',headers:{'Content-Type':'application/pdf'},body:blob});
  const s=await graph(tk,path+'/createUploadSession',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({item:{'@microsoft.graph.conflictBehavior':'replace'}})});
  const CH=320*1024*10; let res;
  for(let i=0;i<blob.size;i+=CH){ const end=Math.min(i+CH,blob.size); const r=await fetch(s.uploadUrl,{method:'PUT',headers:{'Content-Range':`bytes ${i}-${end-1}/${blob.size}`},body:blob.slice(i,end)}); if(!r.ok&&r.status!==202) throw new Error('업로드 실패 '+r.status); res=await r.json(); }
  return res;
}

/* ---------------- app API ---------------- */
window.app={
  go(v){ if(cur) saveNow(); state.view=v; if(v!=='edit') cur=null; window.scrollTo(0,0); render(); },
  step(i){ state.step=Math.max(0,Math.min(7,i)); window.scrollTo(0,0); render(); },
  listF(f){ state.listF=f; render(); },
  newBatch(){ cur=newBatch(); cur.mat.batchId=nextBatchId(cur.mat.product,cur.mat.mfgDate); cur.mat.prodId=nextProdId(cur.mat.product,cur.mat.shipDate); cur.mat.lots=autoAlloc(cur.mat.product).rows; state.view='edit'; state.step=0; saveNow(); window.scrollTo(0,0); render(); },
  open(id){ const b=state.batches.find(x=>x.id===id); if(!b) return; cur=ensure(JSON.parse(JSON.stringify(b))); state.view='edit'; state.step=cur.status==='완료'?7:0; window.scrollTo(0,0); render(); },
  setProd(k){ if(locked()) return; const old=cur.mat.product; if(old===k) return;
    if(cur.mat.lots.some(r=>r.lotId)&&!confirm('품목을 바꾸면 선택한 Lot이 현재고 기준으로 다시 배정됩니다. 계속할까요?')) return;
    cur.mat.product=k; cur.mat.isoTank=defIso(k,1); cur.mat.isoTank2=''; cur.mat.lots=autoAlloc(k).rows; cur.s4.chk={}; cur.s5.ibcChk={};
    if(autoId(cur.mat.batchId)) cur.mat.batchId=nextBatchId(k,cur.mat.mfgDate); if(autoId(cur.mat.prodId)) cur.mat.prodId=nextProdId(k,cur.mat.shipDate); touch(); render(); },
  genId(){ cur.mat.batchId=nextBatchId(PK(),cur.mat.mfgDate); touch(); render(); },
  genProdId(){ cur.mat.prodId=nextProdId(PK(),cur.mat.shipDate); touch(); render(); },
  alloc(){ if(locked()) return; if(cur.mat.lots.some(r=>r.lotId)&&!confirm('입력한 Lot을 지우고 현재고 선입선출로 다시 배정할까요?')) return;
    const r=autoAlloc(PK()); cur.mat.lots=r.rows; cur.s4.chk={}; cur.s5.ibcChk={}; touch(); render(); if(r.short>0) toast(`현재고가 부족합니다 — ${r.short} ${PD().drum?'Drum':'IBC'} 모자람`,4000); },
  addLot(){ cur.mat.lots.push({lotId:'',count:'',unitKg:''}); touch(); render(); },
  delLot(i){ cur.mat.lots.splice(i,1); if(!cur.mat.lots.length) cur.mat.lots.push({lotId:'',count:'',unitKg:''}); cur.s4.chk={}; cur.s5.ibcChk={}; touch(); render(); },
  ppeAll(i){ const w=cur.ppe.workers[i]; const all=PPE_ITEMS.every(([k])=>w.items[k]); PPE_ITEMS.forEach(([k])=>w.items[k]=!all); touch(); render(); },
  sigSet(path,name){ name=(name||'').trim(); setP(cur,path,name?{n:name,t:nowLocal()}:null); closeModal(); touch(); render(); },
  closeModal, complete, reopen,
  pdf(m){ makePdf(m); },
  async delBatch(id){ id=id||(cur&&cur.id); const b=(cur&&cur.id===id)?cur:state.batches.find(x=>x.id===id); if(!b) return;
    if(b.status==='완료'){ toast('완료된 배치는 먼저 "완료 취소" 후 삭제하세요'); return; }
    if(!confirm(`${b.mat&&b.mat.batchId||'이 배치'} (작성중)를 삭제할까요?\n입력한 내용은 복구할 수 없습니다.`)) return;
    clearTimeout(saveT);
    try{ if(fb){ const fsM=await import(FB_URL+'firebase-firestore.js'); await fsM.deleteDoc(fb.doc(fb.db,COL.batch,id)); } state.batches=state.batches.filter(x=>x.id!==id); }catch(e){ toast('삭제 실패: '+(e.code||e.message)); return; }
    if(cur&&cur.id===id){ cur=null; state.view='list'; } toast('삭제되었습니다'); render(); },
  isoQuickAdd(path){ const no=($('niNo').value||'').trim(); if(!no){ toast('ISO Tank #를 입력하세요'); return; }
    const l=state.cfg.isoTanks=state.cfg.isoTanks||[]; if(!l.some(t=>t.no===no)) l.push({no,prod:$('niProd').value}); saveCfg(); setP(cur,path,no); closeModal(); touch(); render(); },
  isoAdd(){ app.isoCollect(); state.cfg.isoTanks.push({no:'',prod:''}); render(); },
  isoDel(i){ app.isoCollect(); state.cfg.isoTanks.splice(i,1); render(); },
  isoCollect(){ state.cfg.isoTanks=(state.cfg.isoTanks||[]).map((t,i)=>({no:($('iso_no_'+i)?$('iso_no_'+i).value:t.no).trim(),prod:$('iso_pr_'+i)?$('iso_pr_'+i).value:t.prod})); },
  async isoSave(){ app.isoCollect(); state.cfg.isoTanks=state.cfg.isoTanks.filter(t=>t.no); await saveCfg(); render(); },
  async saveSettings(){ const c=state.cfg; c.workers=$('cfgWorkers').value.split('\n').map(s=>s.trim()).filter(Boolean); c.customers=$('cfgCust').value.split('\n').map(s=>s.trim()).filter(Boolean);
    c.passMin=+$('cfgMin').value||18200; c.passMax=+$('cfgMax').value||19000; c.maxKg=+$('cfgMaxKg').value||19000; c.weighDangerLb=+$('cfgDanger').value||40000; c.weighPassLb=+$('cfgWPass').value||500; await saveCfg(); render(); },
  async saveMs(){ const ms=state.cfg.ms; const nc=$('msClient').value.trim(), nt=$('msTenant').value.trim(), ns=$('msShare').value.trim();
    if(nc!==ms.clientId||nt!==ms.tenantId||ns!==ms.shareUrl){ ms.driveId=''; ms.itemId=''; ms.folderName=''; } ms.clientId=nc; ms.tenantId=nt; ms.shareUrl=ns;
    try{ await msalInit(); busy(true,'Microsoft 로그인 / 폴더 확인 중…'); const tk=await msToken(); await spResolve(tk); busy(false); toast('폴더 연결 확인: '+ms.folderName,4000); }catch(e){ busy(false); try{ await saveCfg(); }catch(_){} toast('연결 실패: '+(e.message||e),6000); } render(); },
  async msLogout(){ try{ const a=getMsal(); const acc=a.getAllAccounts()[0]; if(acc) await a.logoutPopup({account:acc}); }catch(e){} render(); },
  googleLogin, async logout(){ if(auth) await AUM.signOut(auth); }
};
